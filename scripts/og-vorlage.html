<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OG Preview — Womensurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,200..900,0..100;1,9..144,200..900,0..100&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Die Karte fuellt das Fenster exakt aus, damit ein Screenshot des
     Ansichtsfensters genau die Karte trifft. Ohne Rand, ohne Zentrierung:
     `scripts/og-bild.mjs` schiesst mit --window-size=1200,630. */
  html, body {
    background: #0a0807;
    margin: 0;
    padding: 0;
    font-family: 'Fraunces', Georgia, serif;
    color: #f4ede4;
  }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: rgba(244,237,228,0.5);
    text-transform: uppercase;
    text-align: center;
    line-height: 1.6;
    max-width: 700px;
  }

  .hint b {
    color: #ff2e88;
    font-weight: 500;
  }

  /* THE OG CARD — exactly 1200 × 630 */
  .og {
    width: 1200px;
    height: 630px;
    background: #0a0807;
    color: #f4ede4;
    padding: 60px 72px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  /* Subtle background grid */
  .og::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(244,237,228,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(244,237,228,0.035) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  /* Pink accent flare in upper right */
  .og::after {
    content: "";
    position: absolute;
    top: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,46,136,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── HEADER ── */
  .head {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(244,237,228,0.12);
    padding-bottom: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(244,237,228,0.55);
  }

  .head .left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff2e88;
    box-shadow: 0 0 12px rgba(255,46,136,0.6);
  }

  /* ── CENTER ── */
  .core {
    position: relative;
    z-index: 2;
    align-self: center;
    margin-top: -8px;
  }

  .num {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-variation-settings: "opsz" 144, "SOFT" 0;
    font-size: 300px;
    line-height: 0.88;
    letter-spacing: -0.05em;
    color: #ff2e88;
    display: block;
  }

  .sub {
    margin-top: 28px;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-variation-settings: "opsz" 72;
    font-size: 38px;
    line-height: 1.15;
    color: rgba(244,237,228,0.92);
    max-width: 780px;
  }

  /* ── FOOTER ── */
  .foot {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid rgba(244,237,228,0.12);
    padding-top: 22px;
  }

  .wm {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-variation-settings: "opsz" 96;
    font-size: 30px;
    letter-spacing: -0.02em;
    color: #f4ede4;
  }

  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(244,237,228,0.45);
  }
</style>
</head>
<body>

  <div class="og">
    <header class="head">
      <div class="left">
        <span class="pulse"></span>
        <span>Gender Pension Gap · Deutschland</span>
      </div>
      <div>Issue 01 · 2026</div>
    </header>

    <div class="core">
      <div class="num">−36,0%</div>
      <div class="sub">
        Prozent weniger Rente. Für Frauen.<br/>
        Im Schnitt. In Deutschland. Heute.
      </div>
    </div>

    <footer class="foot">
      <div class="wm">womensurance</div>
      <div class="url">womensurance.de</div>
    </footer>
  </div>

</body>
</html>
